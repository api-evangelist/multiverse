aid: multiverse
name: Multiverse
description: >-
  Multiverse is a British education-technology company (founded 2016 by Euan
  Blair and Sophie Adelman, headquartered in London) that operates an AI-adoption
  and workforce-upskilling platform. It delivers apprenticeships and training
  programmes in AI, data, software engineering, and digital skills, pairing
  on-the-job learning with expert coaching so employers can close skills gaps and
  build future-ready teams. Backed by investors including Lightspeed Venture
  Partners, General Catalyst, and StepStone Group, Multiverse serves enterprise
  clients across the UK and US. The company exposes no public developer API; its
  digital surface is a marketing site, a learner/employer login, a help centre, a
  community hub, a blog, a service status page, and a trust centre.
